apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: site-content
    namespace: test-site
    files:
      - index.html
      - orca.jpg
      - matrix-server=well-known-server.json
      - matrix-client=well-known-client.json
    options:
      disableNameSuffixHash: true
