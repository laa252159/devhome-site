<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>DEVHOME</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    color: #e8f6ff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(18px, 5vw, 64px);
    background:
      radial-gradient(1100px 680px at 50% -12%, rgba(34, 211, 238, .20), transparent 62%),
      radial-gradient(900px 620px at 8% 112%, rgba(59, 130, 246, .16), transparent 60%),
      radial-gradient(800px 520px at 96% 92%, rgba(14, 165, 233, .12), transparent 60%),
      linear-gradient(160deg, #07111f 0%, #0a1a2b 48%, #050e19 100%);
    overflow-x: hidden;
  }

  .card {
    position: relative;
    width: min(940px, 100%);
    border-radius: clamp(20px, 3vw, 30px);
    overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    border: 1px solid rgba(180, 225, 255, .16);
    box-shadow: 0 34px 90px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255,255,255,.10);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
  }

  .visual {
    position: relative;
    height: clamp(210px, 40vw, 370px);
    overflow: hidden;
    background: #06131f;
  }

  .visual::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 45%, rgba(5, 14, 25, .55) 78%, rgba(5, 14, 25, .92) 100%);
    pointer-events: none;
  }

  .glow {
    position: absolute;
    inset: -30%;
    background: radial-gradient(circle at 50% 42%, rgba(56, 189, 248, .32), transparent 58%);
    filter: blur(18px);
  }

  img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 46%;
    display: block;
    animation: drift 9s ease-in-out infinite;
    filter: saturate(1.06) contrast(1.04);
  }

  @keyframes drift {
    0%, 100% { transform: translateY(0) scale(1.005); }
    50%      { transform: translateY(-9px) scale(1.018); }
  }

  .content {
    position: relative;
    text-align: center;
    padding: clamp(26px, 5vw, 52px) clamp(20px, 5vw, 48px) clamp(32px, 6vw, 58px);
    background: linear-gradient(180deg, rgba(5, 14, 25, .55), rgba(5, 14, 25, 0) 55%);
  }

  .kicker {
    font-size: clamp(10px, 1.8vw, 12px);
    letter-spacing: .42em;
    text-transform: uppercase;
    color: #7dd3fc;
    font-weight: 700;
    margin-bottom: clamp(10px, 2vw, 16px);
  }

  h1 {
    margin: 0;
    font-size: clamp(46px, 12vw, 108px);
    line-height: 1;
    font-weight: 800;
    letter-spacing: clamp(.06em, 1.4vw, .16em);
    background: linear-gradient(180deg, #ffffff 8%, #bde9ff 55%, #6cbbe8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 8px 26px rgba(56, 189, 248, .28));
    word-break: keep-all;
  }

  .line {
    width: clamp(54px, 12vw, 76px);
    height: 2px;
    margin: clamp(18px, 3vw, 26px) auto clamp(14px, 2.5vw, 20px);
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, #67e8f9, transparent);
  }

  @media (max-width: 480px) {
    .card { border-radius: 20px; }
    .visual { height: 220px; }
  }

  @media (prefers-reduced-motion: reduce) {
    img { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="visual">
      <div class="glow"></div>
      <img src="/orca.jpg" alt="Касатка в океане">
    </div>
    <div class="content">
      <div class="kicker">Welcome to</div>
      <h1>DEVHOME</h1>
      <div class="line"></div>
    </div>
  </main>
</body>
</html>
